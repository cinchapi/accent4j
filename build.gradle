plugins {
  id 'java-library'
  id 'eclipse'
  id 'maven-publish'
  id 'signing'
  id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

repositories {
  mavenCentral()
}

dependencies {
  api 'org.fusesource.jansi:jansi:1.11'
  api 'com.google.code.findbugs:jsr305:3.0.1'
  api 'com.google.guava:guava:25.1-jre'
  api 'org.slf4j:slf4j-api:1.7.5'
  api 'ch.qos.logback:logback-classic:1.2.11'

  testImplementation 'junit:junit:4.11'
}

/**
 * Return the publication coordinate without advancing the build counter. Branch
 * suffix digits remain part of the coordinate.
 */
def getPublishedVersion = { buildVersion ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'bash', rootProject.file('.agents/tools/version'),
                '--published', buildVersion.toString()
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

/**
 * Return one semantic build version for this project and advance its counter.
 * Fail if the shared tool cannot read the version or identify the branch.
 */
def getVersion = { ->
  def stdout = new ByteArrayOutputStream()
  exec {
    commandLine 'bash', rootProject.file('.agents/tools/version'),
                '--root', rootProject.projectDir.absolutePath
    standardOutput = stdout
  }
  return stdout.toString().trim()
}

def getBranch = { ->
  def branch = System.getenv('CIRCLE_BRANCH')
      ?: System.getenv('GITHUB_HEAD_REF')
      ?: System.getenv('GITHUB_REF_NAME')
      ?: System.getenv('BRANCH_NAME')
      ?: System.getenv('CI_COMMIT_BRANCH')
      ?: System.getenv('GIT_BRANCH')
  if (branch) {
    return branch
  }
  def stdout = new ByteArrayOutputStream()
  exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    standardOutput = stdout
  }
  return stdout.toString().trim()
}

ext.globalVersion = getVersion()
ext.currentBranch = getBranch()

group = 'com.cinchapi'
version = globalVersion

ext.mavenVersion = getPublishedVersion(globalVersion)

ext.isRelease = mavenVersion.matches('^[0-9]+\\.[0-9]+\\.[0-9]+(-rc[0-9]+)?$')
ext.publishToMavenCentral = (currentBranch == 'master' && isRelease) || (currentBranch == 'develop' && mavenVersion.endsWith('-SNAPSHOT'))

logger.lifecycle("Publishing: branch={}, mavenVersion={}, isRelease={}, publishToMavenCentral={}", currentBranch, mavenVersion, isRelease, publishToMavenCentral)

if (JavaVersion.current().isJava8Compatible()) {
  allprojects {
    tasks.withType(Javadoc) {
      options.addStringOption('Xdoclint:none', '-quiet')
    }
  }
}

jar {
  manifest {
    attributes(
      "Specificiation-Title": "Accent4J",
      "Specificiation-Version": version,
      "Implementation-Version": version
    )
  }
}

java {
  withSourcesJar()
  withJavadocJar()
}

// Sonatype / Maven Central via Nexus Publish Plugin
nexusPublishing {
  repositories {
    sonatype {
      nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
      snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
      username = System.getenv('CENTRAL_TOKEN_USER')
      password = System.getenv('CENTRAL_TOKEN_PASS')
    }
  }
}

// Skip every Sonatype task, including the staging repository setup and each
// publication's upload, for builds that do not publish to Maven Central
tasks.matching { it.name.contains('Sonatype') }.configureEach {
  onlyIf { publishToMavenCentral }
}
tasks.matching { it.name.contains('closeSonatype') || it.name.contains('releaseSonatype') || it.name.contains('closeAndReleaseSonatype') }.configureEach {
  onlyIf { publishToMavenCentral && currentBranch == 'master' }
}

publishing {
  repositories {
    maven {
      name = 'cloudsmith'
      def releasesRepoUrl = "https://api-g.cloudsmith.io/maven/cinchapi/open-source/"
      def snapshotsRepoUrl = "https://api-g.cloudsmith.io/maven/cinchapi/open-source-snapshots/"
      url = isRelease ? releasesRepoUrl : snapshotsRepoUrl
      credentials {
        username = System.getenv('CLOUDSMITH_API_USER')
        password = System.getenv('CLOUDSMITH_API_KEY')
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      groupId = group
      artifactId = project.name
      version = mavenVersion
      pom {
        name = 'Accent4J'
        description = 'Accent4J is a suite of utility libraries for Java'
        url = 'https://github.com/cinchapi/accent4j'
        inceptionYear = '2015'
        licenses {
          license {
            name = 'Apache-2.0'
            url = 'https://spdx.org/licenses/Apache-2.0.html'
          }
        }
        developers {
          developer {
            id = 'jnelson'
            name = 'Jeff Nelson'
          }
        }
        scm {
          connection = 'scm:git:https://github.com/cinchapi/accent4j.git'
          developerConnection = 'scm:git:ssh://github.com/cinchapi/accent4j.git'
          url = 'https://github.com/cinchapi/accent4j'
        }
      }
    }
  }
}

signing {
  required { publishToMavenCentral && !mavenVersion.endsWith('SNAPSHOT') }
  // CI supplies the release key as properties instead of a keyring file
  def signingKey = findProperty('signingKey')
  if(signingKey) {
    useInMemoryPgpKeys(signingKey, findProperty('signingPassword'))
  }
  sign publishing.publications.maven
}
